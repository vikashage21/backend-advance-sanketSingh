<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.css">

        function registerController() {
            document.write(document.querySelector('#movie').value)
        }
</script>

            <body class="container-fluid">

    <!-- Open Modal -->
                <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#movieContainer">

                    <div class="modal-dialog">

                        <div class="modal-content">

                            <!-- Header -->

                            </div>

                            <!-- Body -->
                            <div class="modal-body">

                                <select class="form-select" id="movie">

                                </select>

                                <select class="form-select">

                                    <option>bangaluru</option>
                                </select>
                                <select class="form-select">
                                    <option>Select seat</option>
                                    <option>front</option>
                                </select>
                                <button class="bnt btn-primary" onclick="registerController()"> save</button>

                            </div>

                        </div>

                    </div>

                </div>

    </body>

</html>

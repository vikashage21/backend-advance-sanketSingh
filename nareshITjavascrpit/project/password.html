<!DOCTYPE html>
<html>

<head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <h1 class="title">Hello World!</h1>
    <p id="currentTime"></p>
    <input id='txtPsw' placeholder="enter your password">
    <button onclick="verifyPassword()">login</button>
    <script>
        let obj = {
            "userName": "vikash",
            "password": 12345
        }

        let count = 0;
        // this is working becouse i define the count inside the function every time button click the count become 0 and re iniszaling the variable .
        function verifyPassword() {
            let inputElement = document.getElementById('txtPsw');
            let password = parseInt(inputElement.value)
            if (!password) { return }
            if (password == obj.password) {
                console.log("login successfull")
            } else {
                count++
                if (count <= 3) {
                    console.log(`try agian ${3 - count}`);
                }
                if (count == 3) {
                    console.log('your account blocked')
                    return;
                }
            }
        }

        verifyPassword(obj)
    </script>

</body>

</html>

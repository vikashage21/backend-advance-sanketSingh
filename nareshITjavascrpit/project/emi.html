<!DOCTYPE html>
<html lang="en">
<link>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>emi calculator</title>
<link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
</link>
<style>
    .box {
        margin:40px;
        padding: 40px;
        box-shadow: 4px 6px 4px 2px;
    }
</style>
<script src="src/emi.js" type="text/javascript"></script>
</head>

<body>
    <div class="container-fluid">
        <div class="box">
            <div class="row">
                <div class="col">
                    <div class="d-flex">
                        <p class="mx-1" id="rangeAmount">
                            loan amount &#8360 50000 </p>
                        <input id="inputAmount" type="range" min="50000" max="700000" value="50000" onchange="inputRangeControl()">
                    </div>
                </div>
                <div class="col">
                    <div class="d-flex">
                        <p class="mx-1" id="interestAmount">
                            interest rate %10
                        </p>
                        <input id="interestRate" type="range" min="10" max="30" step="0.1" value="11.5" onChange="rateAmountChange()" >
                    </div>
                </div>
                <div class="col">
                    <div class="d-flex">
                        <p class="mx-1" id="loanTenureYears">
                            loan tenure 1 years
                        </p>
                        <input id="loanTenure" type="range" min="1" max="5" value="1" onChange="loanTenureController()">
                    </div>
                </div>
            </div>
            <div class="row mt-2">
                <button class="btn btn-primary" onClick="emiCalculateController()"> calculate</button>
            </div>
        </div>
        <div>

            <p id="result" class="mt-5 text-center">

            </p>



        </div>

    </div>

</body>

</html>
